server {
    listen 443 ssl;
    server_name booklad.eleonoreeuzenes.fr;

    ssl_certificate /etc/letsencrypt/live/booklad.eleonoreeuzenes.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booklad.eleonoreeuzenes.fr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # FRONTEND : Vue compilé
    root /var/www/booklad/frontend/dist;
    index index.html;

    # Serveur Vue SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # BACKEND : Laravel API
    location /api/ {
        proxy_pass http://laravel_backend:8000/; # Nom du conteneur Docker pour Laravel
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # BLOQUER les fichiers cachés
    location ~ /\. {
        deny all;
    }

    # LOGS
    access_log /var/log/nginx/booklad_access.log;
    error_log /var/log/nginx/booklad_error.log;
}
